# Render Blueprint - https://render.com/docs/blueprint-spec
# In Render: New > Blueprint > pick this repository. Render reads this file
# and creates the service with no manual configuration.
services:
  - type: web
    name: bdf-lab-01
    runtime: node
    plan: free
    rootDir: lab-01
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
